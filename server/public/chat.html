<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 260px;
            background: #161b22;
            border-right: 1px solid #30363d;
            overflow-y: auto;
            padding: 15px;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px 0;
        }

        .sidebar-header h2 {
            font-size: 18px;
            color: #58a6ff;
        }

        .new-chat-btn {
            background: #238636;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            width: 100%;
        }

        .new-chat-btn:hover {
            background: #2ea043;
        }

        .conversations-list {
            margin-top: 20px;
        }

        .conversation-item {
            padding: 10px 12px;
            margin-bottom: 5px;
            background: #0d1117;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.2s;
        }

        .conversation-item:hover {
            background: #21262d;
        }

        .conversation-item.active {
            background: #58a6ff;
            color: black;
            font-weight: 600;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h1 {
            font-size: 16px;
            color: #58a6ff;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .logout-btn {
            background: #da3633;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .logout-btn:hover {
            background: #f85149;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            gap: 10px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .message.assistant .message-content {
            background: #21262d;
            border-left: 3px solid #58a6ff;
        }

        .message.user .message-content {
            background: #238636;
            color: white;
        }

        .input-area {
            background: #161b22;
            border-top: 1px solid #30363d;
            padding: 15px 20px;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 14px;
            resize: none;
            max-height: 100px;
            font-family: inherit;
        }

        .message-input:focus {
            outline: none;
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
        }

        .send-btn {
            background: #238636;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .send-btn:hover:not(:disabled) {
            background: #2ea043;
        }

        .send-btn:disabled {
            background: #30363d;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #8b949e;
            text-align: center;
        }

        .empty-state h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: #21262d;
            border-left: 3px solid #58a6ff;
            border-radius: 12px;
            width: fit-content;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #58a6ff;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.3;
            }
            30% {
                opacity: 1;
            }
        }

        .loading {
            text-align: center;
            color: #8b949e;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>💬 Chats</h2>
            <button class="new-chat-btn" onclick="newChat()">+ New</button>
        </div>
        <div class="conversations-list" id="conversationsList"></div>
    </div>

    <!-- Main Chat Area -->
    <div class="main-content">
        <!-- Header -->
        <div class="chat-header">
            <h1 id="chatTitle">Welcome to AI Chatbot</h1>
            <div class="header-actions">
                <span id="userInfo"></span>
                <button class="logout-btn" onclick="logout()">🚪 Logout</button>
            </div>
        </div>

        <!-- Messages -->
        <div class="messages-container" id="messagesContainer">
            <div class="empty-state">
                <h2>🤖 AI Chatbot</h2>
                <p>Start a new conversation or select one from the sidebar</p>
            </div>
        </div>

        <!-- Input -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea
                    class="message-input"
                    id="messageInput"
                    placeholder="Type your message... (Shift+Enter for new line)"
                    rows="1"
                    onkeypress="handleKeyPress(event)"
                    
                ></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()" >
                    ➤ Send
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api/chat';
        let currentConversationId = null;
        let isLoading = false;

        // Parse JWT
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch {
                return null;
            }
        }

        function setChatInputEnabled(enabled) {
            const input = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            if (input) input.disabled = !enabled;
            if (sendBtn) sendBtn.disabled = !enabled;
        }

        // Check auth
        function checkAuth() {
            const token = localStorage.getItem('accessToken');
            if (!token) {
                window.location.href = '/index.html';
                return false;
            }
            const decoded = parseJwt(token);
            if (!decoded || !decoded.name) {
                window.location.href = '/index.html';
                return false;
            }
            document.getElementById('userInfo').textContent = `👤 ${decoded.name}`;
            setChatInputEnabled(true);
            return true;
        }

        // Get Authorization header
        function getAuthHeader() {
            const token = localStorage.getItem('accessToken');
            if (!token) {
                return null;
            }
            return `Bearer ${token}`;
        }

        // Load conversations
        async function loadConversations() {
            try {
                const authHeader = getAuthHeader();
                if (!authHeader) {
                    window.location.href = '/index.html';
                    return;
                }

                const url = `${API_BASE}/conversations`;
                console.log('📍 Fetching conversations from:', url);

                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 10000);

                const response = await fetch(url, {
                    headers: { 'Authorization': authHeader },
                    signal: controller.signal
                });

                clearTimeout(timeout);
                console.log('Response status:', response.status);

                if (!response.ok) {
                    console.error('API Error:', response.status);
                    const errorText = await response.text();
                    console.error('Error response:', errorText);
                    return;
                }

                const data = await response.json();
                console.log('✅ Conversations loaded:', data);

                const conversations = data.conversations || [];
                const list = document.getElementById('conversationsList');
                list.innerHTML = '';

                if (conversations.length === 0) {
                    list.innerHTML = '<p style="font-size: 12px; color: #8b949e;">No conversations yet</p>';
                    setChatInputEnabled(true);
                    return;
                }

                conversations.forEach(conv => {
                    const item = document.createElement('div');
                    item.className = `conversation-item ${conv._id === currentConversationId ? 'active' : ''}`;
                    item.textContent = conv.title || 'Untitled';
                    item.onclick = () => selectConversation(conv._id, conv.title || 'Untitled');
                    list.appendChild(item);
                });

                setChatInputEnabled(true);
            } catch (error) {
                console.error('Error loading conversations:', error);
                setChatInputEnabled(true);
            }
        }

        // Select conversation
        async function selectConversation(conversationId, title) {
            currentConversationId = conversationId;
            document.getElementById('chatTitle').textContent = title;
            setChatInputEnabled(true);
            
            await loadMessages(conversationId);
            loadConversations();
        }

        // Load messages
        async function loadMessages(conversationId) {
            try {
                const authHeader = getAuthHeader();
                const response = await fetch(`${API_BASE}/history/${conversationId}`, {
                    headers: authHeader ? { 'Authorization': authHeader } : {}
                });
                const data = await response.json();
                
                const container = document.getElementById('messagesContainer');
                container.innerHTML = '';
                
                data.messages.forEach(msg => {
                    appendMessage(msg.content, msg.role);
                });
                
                container.scrollTop = container.scrollHeight;
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }

        // New chat
        async function newChat() {
            try {
                const authHeader = getAuthHeader();
                const response = await fetch(`${API_BASE}/new-conversation`, {
                    method: 'POST',
                    headers: authHeader ? { 'Authorization': authHeader } : {}
                });
                const data = await response.json();
                
                if (!data || !data.conversation_id) {
                    throw new Error('No conversation returned');
                }

                currentConversationId = data.conversation_id;
                document.getElementById('chatTitle').textContent = data.title || 'New Chat';
                document.getElementById('messagesContainer').innerHTML = '';
                setChatInputEnabled(true);
                
                loadConversations();
            } catch (error) {
                console.error('Error creating conversation:', error);
                document.getElementById('chatTitle').textContent = 'New Chat';
                setChatInputEnabled(true);
            }
        }

        // Send message
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message || isLoading) return;

            if (!currentConversationId) {
                await newChat();
            }

            if (!currentConversationId) {
                alert('Unable to start a chat. Please try again.');
                return;
            }
            
            isLoading = true;
            document.getElementById('sendBtn').disabled = true;
            
            // Show user message
            appendMessage(message, 'user');
            input.value = '';
            
            // Show typing indicator
            showTypingIndicator();
            
            try {
                const authHeader = getAuthHeader();
                const response = await fetch(`${API_BASE}/message`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(authHeader ? { 'Authorization': authHeader } : {})
                    },
                    body: JSON.stringify({
                        message: message,
                        conversation_id: currentConversationId
                    })
                });
                
                const data = await response.json();
                
                // Remove typing indicator
                document.getElementById('messagesContainer').querySelector('.typing-indicator')?.remove();
                
                if (data.success) {
                    appendMessage(data.message, 'assistant');
                    loadConversations();
                } else {
                    appendMessage('Error: Unable to get response', 'assistant');
                }
            } catch (error) {
                document.getElementById('messagesContainer').querySelector('.typing-indicator')?.remove();
                appendMessage('Error: Unable to connect to server', 'assistant');
            }
            
            isLoading = false;
            document.getElementById('sendBtn').disabled = false;
        }

        // Append message to display
        function appendMessage(content, role) {
            const container = document.getElementById('messagesContainer');
            
            // Remove empty state if exists
            const emptyState = container.querySelector('.empty-state');
            if (emptyState) emptyState.remove();
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;
            
            messageDiv.appendChild(contentDiv);
            container.appendChild(messageDiv);
            
            container.scrollTop = container.scrollHeight;
        }

        // Show typing indicator
        function showTypingIndicator() {
            const container = document.getElementById('messagesContainer');
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            
            messageDiv.appendChild(typingDiv);
            container.appendChild(messageDiv);
            
            container.scrollTop = container.scrollHeight;
        }

        // Handle key press
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // Logout
        function logout() {
            localStorage.removeItem('accessToken');
            localStorage.removeItem('refreshToken');
            window.location.href = '/index.html';
        }

        // Initialize
        window.addEventListener('load', async () => {
            if (checkAuth()) {
                setChatInputEnabled(true);
                await loadConversations();
            }
        });
    </script>
</body>
</html>
